# Installed into .git/hooks by `lefthook install`, which `yarn install` runs
# through the `postinstall` script. No manual step.
#
# There is no pre-push hook on purpose: this iteration has no test script, so
# there is nothing for one to run. Add `pre-push: { commands: { tests: { run:
# yarn test } } }` together with the first test script.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,json,md,css,yml,yaml}"
      run: yarn prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs}"
      run: yarn lint
    typecheck:
      glob: "*.{ts,tsx}"
      run: yarn typecheck
    knip:
      glob: "*.{ts,tsx,js,mjs,json}"
      run: yarn knip
